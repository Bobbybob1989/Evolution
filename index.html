 presence:{name:'Présence',attribute:'Présence',action:'Dire quelque chose de sincère et précis à quelqu’un.',example:'À un proche : « J’ai apprécié que tu prennes du temps pour m’écouter hier. » Ou au travail : « Je ne suis pas d’accord sur ce point, et voici pourquoi. »',why:'Être présent, c’est oser exprimer une pensée vraie, respectueuse et adaptée au contexte. Pas parler pour parler.',question:'As-tu exprimé ce que tu pensais vraiment, avec respect ?'},
 autonomie:{name:'Autonomie',attribute:'Autonomie',action:'Prendre une petite décision sans demander de validation inutile.',example:'Tu choisis ton programme de la soirée ou tu prends une décision simple au travail après avoir vérifié les informations nécessaires, sans demander à trois personnes de te rassurer.',why:'L’autonomie ne signifie pas refuser les conseils : elle consiste à décider par toi-même quand tu disposes des éléments nécessaires.',question:'As-tu pris une décision qui t’appartenait ?'},
 resilience:{name:'Résilience',attribute:'Résilience',action:'Reprendre une tâche que tu avais repoussée.',example:'Tu avais laissé un message difficile sans réponse. Tu rédiges aujourd’hui les deux premières phrases, ou tu effectues cinq minutes de la tâche.',why:'Un petit retour à l’action compte. Il n’est pas nécessaire de tout terminer pour avancer.',question:'As-tu réellement repris une action évitée ?'},
 liens:{name:'Liens',attribute:'Liens',action:'Écouter quelqu’un sans l’interrompre et lui poser une question.',example:'Lorsqu’un ami raconte sa journée, tu le laisses terminer puis tu demandes : « Qu’est-ce qui a été le plus difficile pour toi ? »',why:'Le but n’est pas de résoudre le problème à sa place, mais de lui accorder une attention réelle.',question:'As-tu laissé une vraie place à la parole de l’autre ?'},
};
const BEHAVIOR_LEVELS={

 ['Exprimer une préférence simple.','Au restaurant : « Je préférerais m’asseoir près de la fenêtre. »'],
 ['Dire quelque chose de sincère et précis à quelqu’un.','« J’ai apprécié que tu m’écoutes hier. »'],
 ['Donner spontanément ton avis.','« Pour ma part, je pense que cette solution serait plus simple. »'],
 ['Exprimer un désaccord respectueux.','« Je comprends ton point de vue, mais je ne suis pas d’accord, car… »'],
 ['Poser une limite claire.','« Je ne peux pas accepter cette demande aujourd’hui. Je peux en revanche… »']

 ['Faire deux respirations avant de répondre.','Face à une remarque, inspire et expire calmement avant de parler.'],
 ['Répondre avec calme à une petite contrariété.','« Je t’ai entendu. J’aimerais expliquer mon point de vue. »'],
 ['Rester posé lors d’un désaccord.','Reformule ce que tu as entendu, puis réponds sans hausser le ton.'],

 ],

 ],

 ],

function behaviorLevel(k){return Math.max(1,Math.min(5,Number(state.behaviorProgress?.[k]?.level)||1))}
function behaviorMission(k){const id=`${today()}:behavior:${k}`,saved=state.behaviorAssignments?.[id],level=saved?.level||behaviorLevel(k),info=BEHAVIOR_LEVELS[k][level-1];return {id,level,action:info[0],example:info[1]}}
function ensureBehaviorAssignments(){state.behaviorAssignments ||= {};for(const k of dailyBehaviorKeys()){const id=`${today()}:behavior:${k}`;if(!state.behaviorAssignments[id])state.behaviorAssignments[id]={level:behaviorLevel(k)}}}
function behaviorRow(k){const b=BEHAVIORS[k],m=behaviorMission(k),completed=!!state.missions[m.id],feedback=state.missions[m.id]?.feedback;v12init();const skipped=!!state.v12.skipped[m.id],context=state.v12.contexts[k]||'',note=state.v12.notes[m.id]||state.missions[m.id]?.note||'';const addon=`<div class="v12-context"><label>Quand cette situation se présente, je pratiquerai cette action (facultatif)<input class="field" data-v12-context="${k}" maxlength="180" value="${esc(context)}" placeholder="Ex. Quand une discussion devient tendue…"></label>${completed?`<p class="small muted">Preuve : ${esc(note||'Aucune note')}</p>`:`<label>Une preuve concrète (facultatif)<textarea class="field" rows="2" maxlength="400" data-v12-note="${esc(m.id)}" placeholder="Ce qui s’est passé, en une phrase…">${esc(note)}</textarea></label><button class="btn sm ghost" data-v12="skip" data-key="${k}">${skipped?'↶ Rendre à nouveau disponible':'Pas eu l’occasion aujourd’hui'}</button>${skipped?'<p class="small muted">Mission reportée, sans échec et sans XP.</p>':''}`}</div>`;return `<div class="behavior-row"><div class="row"><div style="flex:1;min-width:190px"><div class="eyebrow">${esc(b.attribute)} · Niveau ${m.level}/5 <span class="level-dots">${'●'.repeat(m.level)}${'○'.repeat(5-m.level)}</span></div><h3>${esc(m.action)} <button type="button" class="help-dot" data-action="explain" data-key="${k}" aria-expanded="false" aria-label="Voir un exemple pour ${esc(b.name)}" title="Voir un exemple">!</button></h3></div><span class="${completed?'ok':'tag'}">${completed?'✓ Accomplie':'À pratiquer'}</span></div><div class="example-panel hidden"><strong>Exemple concret</strong><p>${esc(m.example)}</p><strong>Pourquoi cette mission ?</strong><p>${esc(b.why)}</p><p class="small muted">Question : ${esc(b.question)}</p></div>${completed?`<p class="small ok">Retour enregistré : ${esc(({easy:'Facile',balanced:'Adapté',hard:'Difficile'})[feedback]||'Accomplie')}. ${feedback==='easy'?'Un nouveau défi viendra après plusieurs réussites faciles.':''}</p>`:`<p class="small muted" style="margin-top:10px">Après l’avoir réalisée, comment l’as-tu vécue ?</p><div class="feedback" ${skipped?'style="display:none"':''}><button class="btn sm secondary" data-action="feedback" data-key="${k}" data-rating="hard">Difficile</button><button class="btn sm secondary" data-action="feedback" data-key="${k}" data-rating="balanced">Adaptée</button><button class="btn sm" data-action="feedback" data-key="${k}" data-rating="easy">Facile</button></div>`}${addon}</div>`}
function recordBehaviorFeedback(k,rating){if(!BEHAVIOR_LEVELS[k]||!['hard','balanced','easy'].includes(rating)||!dailyBehaviorKeys().includes(k))return false;v12init();ensureBehaviorAssignments();const m=behaviorMission(k);if(state.missions[m.id]||state.v12.skipped[m.id])return false;const field=document.querySelector(`[data-v12-note="${m.id}"]`);if(field)state.v12.notes[m.id]=field.value.trim().slice(0,400);state.behaviorProgress ||= {};let p=state.behaviorProgress[k]||{level:1,easyStreak:0,hardStreak:0};p={...p};if(rating==='easy'){p.easyStreak=(p.easyStreak||0)+1;p.hardStreak=0;if(p.easyStreak>=3){p.level=Math.min(5,p.level+1);p.easyStreak=0}}else if(rating==='hard'){p.hardStreak=(p.hardStreak||0)+1;p.easyStreak=0;if(p.hardStreak>=2){p.level=Math.max(1,p.level-1);p.hardStreak=0}}else{p.easyStreak=0;p.hardStreak=0}state.behaviorProgress[k]=p;state.missions[m.id]={date:today(),key:k,level:m.level,action:m.action,feedback:rating,note:state.v12.notes[m.id]||''};state.events.push({id:m.id,date:today(),xp:10,type:'behavior',key:k,attribute:BEHAVIORS[k].attribute,level:m.level,feedback:rating});save();render();return true}

const days=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:1,started:today(),name:'',ratio:0.65,vestAvailable:false,vestKg:2,tests:[],selections:Object.fromEntries(EX.map(k=>[k,{variant:DEFAULT_VARIANT[k],kg:0}])),missions:{},events:[],paths:[],notes:[],behaviorProgress:{},behaviorAssignments:{}});
let state;try{state=JSON.parse(localStorage.getItem(K))||fresh()}catch{state=fresh()};
function normalize(s){let d=fresh();if(!s||typeof s!=='object')return d;let o={...d,...s};o.tests=Array.isArray(s.tests)?s.tests.filter(t=>EX.includes(t.key)&&Number.isFinite(t.max)&&t.max>0&&t.max<=9999&&typeof t.date==='string'&&typeof t.variant==='string').slice(-1000):[];o.missions=s.missions&&typeof s.missions==='object'&&!Array.isArray(s.missions)?s.missions:{};o.events=Array.isArray(s.events)?s.events.slice(-3000):[];o.paths=Array.isArray(s.paths)?s.paths:[];o.selections={...d.selections,...(s.selections||{})};o.behaviorProgress=s.behaviorProgress&&typeof s.behaviorProgress==='object'&&!Array.isArray(s.behaviorProgress)?s.behaviorProgress:{};o.behaviorAssignments=s.behaviorAssignments&&typeof s.behaviorAssignments==='object'&&!Array.isArray(s.behaviorAssignments)?s.behaviorAssignments:{};o.ratio=Number.isFinite(+s.ratio)?Math.min(.7,Math.max(.6,+s.ratio)):.65;o.equipment={barre:true,kettlebell:false,halteres:false,gilet:!!o.vestAvailable,elastiques:false,tapis:false,banc:false,...(s.equipment&&typeof s.equipment==='object'&&!Array.isArray(s.equipment)?s.equipment:{})};return o}

function backupReminder(){let last=state.lastExport||state.started;let age=Math.max(0,days(last,today()));return age>=7?`<div class="notice" style="margin-bottom:14px">⚠ Sauvegarde conseillée : dernier export connu il y a ${age} jours. <button class="btn sm secondary" data-action="export">Exporter maintenant</button> <button class="btn sm ghost" data-action="confirm-export" style="${exportPending?'':'display:none'}">J’ai vérifié mon fichier JSON</button><p class="small">L'export est manuel ; le navigateur ne garantit pas la conservation des données locales.</p></div>`:''}

function hasEquipment(k){return !!state.equipment?.[k]}
function variantRequirement(k,v){if(k==='tractions'&&['classique','lentes'].includes(v))return 'barre';if(k==='tractions'&&v==='assistees')return 'barre';if(k==='squats'&&v==='goblet')return hasEquipment('kettlebell')||hasEquipment('halteres')?null:'kettlebell';if(k==='squats'&&v==='leste')return 'gilet';if(k==='pompes'&&v==='inclinees')return 'banc';return null}
function renderMateriel(){let e=state.equipment;return headerBlock('TON MATÉRIEL','Sélectionne uniquement ce que tu possèdes chez toi. Le matériel de salle est indépendant. Aucun achat n’est nécessaire pour commencer.')+`<div class="card"><h2>Équipement disponible à domicile</h2><p class="muted small">Ces choix servent à proposer des variantes réalistes. Tu restes libre de choisir tes exercices.</p><div class="grid">${EQUIPMENT.map(([k,n])=>`<label style="font-size:15px;color:var(--white);padding:12px;border:1px solid var(--line);border-radius:10px"><input type="checkbox" data-equipment="${k}" ${e[k]?'checked':''}> ${n}</label>`).join('')}</div><div class="fields" style="margin-top:16px"><label>Charge de kettlebell (kg)<input class="field" type="number" id="eq-kb" min="0" max="100" step="0.5" value="${Number(e.kettlebellKg)||0}"></label><label>Haltère disponible (kg)<input class="field" type="number" id="eq-db" min="0" max="100" step="0.5" value="${Number(e.halteresKg)||0}"></label><label>Gilet lesté (kg)<input class="field" type="number" id="eq-vest" min="0" max="100" step="0.5" value="${Number(state.vestKg)||2}"></label></div><button class="btn" style="margin-top:16px" data-action="save-equipment">Enregistrer mon matériel</button></div><div class="card"><h2>Pour les micro-workouts</h2><p class="muted">${hasEquipment('kettlebell')||hasEquipment('halteres')?'✓ Goblet squat disponible avec une charge adaptée.':'Squat classique disponible sans charge ; le goblet squat nécessite une kettlebell ou un haltère.'}</p><p class="muted">${hasEquipment('gilet')?'✓ Variantes lestées possibles, après nouveau test.':'Les variantes lestées ne seront pas proposées sans gilet.'}</p><p class="muted small">Chaque changement de variante ou de charge exige un nouveau test. Les exercices de salle ne sont pas limités par cet inventaire.</p></div>`}
function currentTest(key){let sel=state.selections[key];return [...state.tests].reverse().find(t=>t.key===key&&t.variant===sel.variant&&t.kg===Number(sel.kg||0))||null}
function testDue(key){let t=currentTest(key);return !t||days(t.date,today())>=7}
function prescription(key){let t=currentTest(key);if(!t)return null;let factor=returnPending()?.5:1,low=Math.max(1,Math.floor(t.max*.6*factor)),high=Math.max(low,Math.floor(t.max*.7*factor)),target=Math.max(low,Math.min(high,Math.round(t.max*state.ratio*factor)));return {...t,low,high,target,series:3,unit:CATALOG[key].unit,reprise:returnPending()}}
function activeDates(){planInit();let dates=new Set();for(let [d,a] of Object.entries(state.activityDays))if(a&& (a.gym||a.badminton||a.run))dates.add(d);for(let e of state.events||[])if(e.date&&e.type==='sport'&&e.grade!=='pain')dates.add(e.date);for(let h of state.gym?.history||[])if(h.date)dates.add(h.date);for(let r of state.runs||[])if(r.date)dates.add(r.date);return [...dates].sort()}
function sessionsDone(){return activeDates().length}
function lastPhysicalActivity(){return activeDates().at(-1)||null}
function gapBeforeToday(){let d=lastPhysicalActivity();return d?Math.max(0,days(d,today())):0}
function returnPending(){let d=lastPhysicalActivity();return !!d&&gapBeforeToday()>=7&&!activeDates().includes(today())}
function rank(){let xp=state.events.reduce((a,e)=>a+(e.xp||0),0);const thresholds=[0,350,1100,2500,4800,8500],gates=[0,4,12,25,45,80];let idx=0;for(let i=1;i<thresholds.length;i++)if(xp>=thresholds[i]&&sessionsDone()>=gates[i])idx=i;return {xp,level:RANKS[idx],next:thresholds[Math.min(5,idx+1)],sessionGate:gates[Math.min(5,idx+1)]}}
function startDay(){return Math.max(1,days(state.started,today())+1)}
function phase(){let n=sessionsDone();return n<6?'Éveil':n<18?'Fondation':n<35?'Ascension':n<55?'Émergence':n<90?'Consolidation':'Horizon'}
function exerciseName(k){let s=state.selections[k];return CATALOG[k].variants.find(v=>v[0]===s.variant)?.[1]||CATALOG[k].name}
function dayMode(){return state.dailyModes?.[today()]||'normal'}
function optionalOpen(){return !!state.extraOpen?.[today()]}
function behaviorCount(){return optionalOpen()?3:dayMode()==='complet'?3:1}
// V11 : calendrier flexible, priorité aux séances réellement enregistrées.
function planInit(){state.weekPlan ||= {gymDays:[1,4],badmintonDay:2,runDays:[6,0],runMinimum:1};state.activityDays ||= {};}
function weekday(d=today()){return new Date(d+'T12:00:00').getDay()}
function weekStart(d=today()){let dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()-(dt.getDay()+6)%7);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function inWeek(d){return d>=weekStart()&&days(weekStart(),d)<7}
function todayActivities(){planInit();v4init();let d=today(),flags=state.activityDays[d]||{};return {gym:!!flags.gym||state.gym.history.some(x=>x.date===d),badminton:!!flags.badminton,run:!!flags.run||state.runs.some(x=>x.date===d),rest:!!flags.rest}}
function weeklyCount(type){planInit();v4init();if(type==='run')return new Set([...state.runs.filter(x=>inWeek(x.date)).map(x=>x.date),...Object.keys(state.activityDays).filter(d=>inWeek(d)&&state.activityDays[d]?.run)]).size;if(type==='gym')return new Set([...state.gym.history.filter(x=>inWeek(x.date)).map(x=>x.date),...Object.keys(state.activityDays).filter(d=>inWeek(d)&&state.activityDays[d]?.gym)]).size;return Object.keys(state.activityDays).filter(d=>inWeek(d)&&state.activityDays[d]?.badminton).length}
function dailyFocus(){let a=todayActivities(),d=weekday();if(a.gym)return {type:'gym',title:'Salle effectuée',detail:'Pas de micro-workout aujourd’hui. Récupère après ta séance.'};if(a.rest)return {type:'rest',title:'Repos choisi',detail:'Pas de séance obligatoire. Une mission comportementale reste possible.'};if(a.run||a.badminton)return {type:'sport',title:a.run?'Course enregistrée':'Badminton enregistré',detail:'Micro-workout haut du corps facultatif ; aucun exercice de jambes.'};if(d===2)return {type:'badminton',title:'Badminton prévu',detail:'Confirme après ta séance, ou indique qu’elle est annulée. Aucun exercice de jambes proposé.'};if((d===1||d===4)&&weeklyCount('gym')<2)return {type:'gymoption',title:'Salle possible aujourd’hui',detail:'Si tu vas à la salle, enregistre la séance : elle remplacera le micro-workout.'};if((d===6||d===0)&&weeklyCount('run')<1)return {type:'runoption',title:'Course à privilégier',detail:'Objectif : au moins une sortie cette semaine. Pas de jambes dans les micro-workouts si tu cours.'};return {type:'micro',title:'Micro-workout du jour',detail:'Quelques séries propres suffisent ; adapte-les à ta récupération.'}}
function legsAllowed(){let a=todayActivities(),d=weekday();return !(a.gym||a.run||a.badminton||a.rest||d===2||((d===6||d===0)&&weeklyCount('run')<1))}
function program(){let mode=dayMode(),a=todayActivities();if(a.gym||a.rest)return [];let d=weekday(),rotation=['pompes','tractions','planche'];let first=rotation[(Math.floor(days(state.started,today())/1)%3+3)%3];let upper=[first,...rotation.filter(k=>k!==first)];if(!hasEquipment('barre'))upper=upper.filter(k=>k!=='tractions');if(!upper.length)upper=['pompes','planche'];let keys=mode==='minimum'?upper.slice(0,1):mode==='normal'?upper.slice(0,2):upper.slice();if(legsAllowed()&&mode!=='minimum')keys.push('squats');if(optionalOpen()&&legsAllowed()&&!keys.includes('squats'))keys.push('squats');return [...new Set(keys)].map(k=>({id:k,key:k,p:prescription(k)}))}
function activityPanel(){let a=todayActivities(),f=dailyFocus(),wp=state.weekPlan;let run=weeklyCount('run'),gym=weeklyCount('gym');return `<div class="card"><div class="eyebrow">Planning souple</div><h2>${esc(f.title)}</h2><p class="muted">${esc(f.detail)}</p><div class="row"><span class="pill">Course : ${run} / ${wp.runMinimum} minimum cette semaine</span><span class="pill">Salle : ${gym} / 2 maximum</span></div><p class="small muted">Salle habituelle lundi / jeudi (facultative), badminton mardi, course le week-end. Les jours réels priment sur les jours prévus.</p><div class="row" style="margin-top:12px"><button class="btn sm ${a.gym?'':'secondary'}" data-v11="toggle" data-kind="gym">${a.gym?'✓ Salle aujourd’hui':'Salle faite aujourd’hui'}</button><button class="btn sm ${a.badminton?'':'secondary'}" data-v11="toggle" data-kind="badminton">${a.badminton?'✓ Badminton':'Badminton fait'}</button><button class="btn sm ${a.run?'':'secondary'}" data-v11="toggle" data-kind="run">${a.run?'✓ Course':'Course faite'}</button><button class="btn sm ${a.rest?'':'ghost'}" data-v11="toggle" data-kind="rest">${a.rest?'✓ Repos':'Repos aujourd’hui'}</button></div><p class="small muted">Pour la salle et la course, préfère les journaux détaillés ; ces boutons permettent aussi une confirmation rapide. Une activité ne rapporte pas deux fois des XP.</p></div>`}

function modePanel(){let m=dayMode();return `<div class="card"><h2>Ton rythme aujourd'hui</h2><p class="muted small">Un minimum suffit. Les jours de repos peuvent être consacrés à une action douce ou comportementale. Tu peux en faire davantage si tu en as envie.</p><div class="row">${[['minimum','Minimum · 1 exercice + 1 mission'],['normal','Normal · 2 à 3 exercices + 1 mission'],['complet','Complet · jusqu’à 4 exercices + 3 missions']].map(([v,t])=>`<button class="btn sm ${m===v?'':'secondary'}" data-v8="mode" data-mode="${v}">${t}</button>`).join('')}</div>${m!=='complet'?`<button class="btn sm ghost" style="margin-top:12px" data-v8="extra">${optionalOpen()?'Masquer les missions bonus':'✦ Je suis motivé : afficher les missions bonus'}</button>`:''}<p class="small muted" style="margin-top:10px">Les missions supplémentaires sont facultatives et ne doivent pas compenser une séance manquée.</p></div>`}

function missionId(k){return `${today()}:sport:${k}`}
function done(k){return !!state.missions[missionId(k)]}
function complete(k){if(!bodyworkComplete(k)){alert('Enregistre les séries avant de valider. Une séance partielle peut être reconnue si elle a été pratiquée sans douleur.');return;}let p=prescription(k);if(!p){go('evaluation');return}let id=missionId(k);if(done(k))return;let grade=bodyworkGrade(k,p);if(grade==='pain'&&!confirm('Douleur signalée : l’arrêt sera enregistré sans XP ni progression. Évite cet exercice douloureux et demande un avis médical si nécessaire.'))return;state.missions[id]={date:today(),key:k,variant:p.variant,kg:p.kg,target:p.target,series:p.series,testDate:p.date,grade};state.events.push({id,date:today(),xp:grade==='complete'?20:grade==='partial'?10:0,type:'sport',key:k,grade});save();render()}
function progressionTip(k){let t=currentTest(k),sel=state.selections[k];if(!t)return null;let threshold=k==='planche'?60:15;if(t.max<=threshold)return null;let variants=CATALOG[k].variants,idx=variants.findIndex(v=>v[0]===sel.variant);let next=variants.slice(idx+1).find(v=>!variantRequirement(k,v[0]));if(k!=='planche'&&hasEquipment('gilet')&&sel.variant!=='goblet'&&sel.kg===0&&sel.variant!=='assistees'&&sel.variant!=='inclinees'&&sel.variant!=='assis')return {text:`Tu dépasses ${threshold} répétitions de qualité. Tu peux essayer un gilet de ${state.vestKg} kg, si le mouvement reste contrôlé.`,action:'vest',kg:state.vestKg};if(k!=='planche'&&hasEquipment('gilet')&&sel.variant!=='goblet'&&sel.kg>0)return {text:'Plus de 15 répétitions propres avec lest : tu peux envisager une légère augmentation, puis refaire le test.',action:'vest',kg:+sel.kg+1};if(next)return {text:`Plus de ${threshold} ${k==='planche'?'secondes':'répétitions'} : variante proposée : ${next[1]}. Un nouveau test sera nécessaire.`,action:'variant',variant:next[0]};return {text:'Tu maîtrises cette variante. Privilégie la technique, puis envisage une charge adaptée ou une variante personnalisée.',action:null}}
function changeSelection(k,variant,kg){if(state.bodywork)delete state.bodywork[k];if(!CATALOG[k].variants.some(v=>v[0]===variant))return;if(variantRequirement(k,variant)){alert('Indique d’abord le matériel nécessaire dans l’onglet Matériel.');return;}kg=Number(kg);if(!Number.isFinite(kg)||kg<0||kg>100)return;state.selections[k]={variant,kg};save();render()}
function applyTip(k){let tip=progressionTip(k);if(!tip)return;let s=state.selections[k];if(tip.action==='vest')changeSelection(k,s.variant,tip.kg);if(tip.action==='variant')changeSelection(k,tip.variant,s.kg);go('evaluation')}
function recordTest(k,max,quality){let s=state.selections[k];max=Number(max);if(!Number.isInteger(max)||max<1||max>9999){alert('Indique un maximum entier et positif.');return}if(!quality){alert('Valide uniquement un test réalisé avec une technique correcte, sans douleur.');return}let date=today();let ix=state.tests.findIndex(t=>t.date===date&&t.key===k&&t.variant===s.variant&&t.kg===s.kg);let obj={date,key:k,variant:s.variant,kg:+s.kg,max};if(ix>=0)state.tests[ix]=obj;else state.tests.push(obj);save();render()}
function exerciseCard(k,context){let c=CATALOG[k],s=state.selections[k],p=prescription(k),t=currentTest(k),tip=progressionTip(k),due=testDue(k);let controls=`<div class="fields" style="margin-top:12px"><div style="grid-column:span 2"><label>Variante</label><select class="field" data-action="variant" data-key="${k}">${c.variants.filter(v=>v[0]===s.variant||!variantRequirement(k,v[0])).map(v=>`<option value="${v[0]}" ${v[0]===s.variant?'selected':''}>${v[1]}</option>`).join('')}</select></div><div><label>Lest (kg)</label><input class="field" data-action="kg" data-key="${k}" type="number" min="0" max="100" step="0.5" value="${s.kg}"></div></div>`;
 let stat=t?`<div class="row"><span class="muted small">Dernier max : ${t.max} ${c.unit} · ${esc(t.date)}</span><span class="pill">${due?'Test hebdo à refaire':'Test à jour'}</span></div><div class="big gold">3 × ${p.target} <span style="font-size:14px">${c.unit}${k==='squats'&&s.variant==='bulgares'?' / jambe':''}</span></div><div class="info">60–70 % du max : ${p.low}–${p.high} ${c.unit} · cible ${Math.round(state.ratio*100)} % · repos conseillé 60–90 s</div>`:`<div class="notice">Aucun test pour cette variante${s.kg?' et ce lest':''}. Effectue d'abord un test de maximum de qualité : aucune répétition ne sera inventée.</div>`;
 return `<article class="card"><div class="row"><h3>${c.name}</h3><span class="tag">${esc(exerciseName(k))}</span></div>${controls}<div class="line"></div>${stat}${tip?`<div class="notice" style="margin-top:12px">↗ ${esc(tip.text)} ${tip.action?`<button class="btn sm ghost" data-action="tip" data-key="${k}" style="margin-top:8px">Adopter puis tester</button>`:''}</div>`:''}${context!=='evaluation'&&p?bodyworkCard(k,p):''}${context==='evaluation'?`<div class="line"></div><div class="fields"><div><label>Max de qualité (${c.unit})</label><input class="field" id="max-${k}" type="number" min="1" max="9999" step="1" value="${t?.date===today()?t.max:''}" placeholder="Ex. 12"></div><div style="grid-column:span 2"><label>Validation technique</label><label style="font-size:13px;color:var(--white);margin-top:8px"><input type="checkbox" id="quality-${k}"> Mouvement propre, sans douleur</label></div></div><button class="btn" style="margin-top:12px" data-action="test" data-key="${k}">Enregistrer le test</button>`: `<div class="row" style="margin-top:16px"><span class="small muted">${done(k)?'Mission validée aujourd’hui':due?'Test hebdomadaire recommandé':'Prescription issue du test'}</span><button class="btn ${done(k)?'secondary':''}" data-action="complete" data-key="${k}" ${!p||done(k)||!bodyworkComplete(k)?'disabled':''}>${done(k)?'✓ Validée':'Valider la mission'}</button></div>`}</article>`}
function headerBlock(title,desc){return `<div style="margin:12px 0 22px"><div class="eyebrow">${esc(phase())} · ${sessionsDone()} jours sportifs actifs · Jour calendaire ${startDay()}</div><h1>${title}</h1><p class="muted">${desc}</p></div>`}

function renderEvaluation(){return headerBlock('TES TESTS DE MAXIMUM','Une fois par semaine environ : après échauffement, mesure ton maximum de répétitions propres (ou secondes de gainage). Arrête avant la dégradation de la technique, sans aller jusqu’à l’échec dangereux.')+`<div class="card"><div class="row"><div><h3>Intensité des séances</h3><p class="small muted">Le même pourcentage s’applique à tous les exercices évalués.</p></div><div class="big gold">${Math.round(state.ratio*100)} %</div></div><input aria-label="Intensité" type="range" min="60" max="70" step="1" value="${Math.round(state.ratio*100)}" id="ratio" style="width:100%;accent-color:var(--gold)"><div class="row small muted"><span>60 % · facile</span><span>70 % · soutenu</span></div></div><div class="grid">${EX.map(k=>exerciseCard(k,'evaluation')).join('')}</div><div class="card"><h2>Historique des tests</h2>${state.tests.length? [...state.tests].reverse().slice(0,30).map(t=>`<div class="listrow row"><div>${esc(t.date)} · ${CATALOG[t.key].name} · ${esc(CATALOG[t.key].variants.find(v=>v[0]===t.variant)?.[1]||t.variant)}${t.kg?' · '+t.kg+' kg':''}</div><strong>${t.max} ${CATALOG[t.key].unit}</strong></div>`).join(''):'<p class="muted">Aucun test enregistré.</p>'}</div>`}
function renderProgression(){let r=rank(),total=state.events.length;let sports=state.events.filter(e=>e.type==='sport').length;return headerBlock('TON CHEMIN','Les actions enregistrées sont conservées. Une interruption ne retire aucun XP.')+`<div class="grid three"><div class="card"><div class="eyebrow">Palier</div><div class="big gold">${r.level}</div><p class="small muted">Le prochain rang exige des XP et des journées sportives actives ; aucun XP n'est retiré.</p></div><div class="card"><div class="eyebrow">Expérience</div><div class="big">${r.xp} XP</div></div><div class="card"><div class="eyebrow">Missions validées</div><div class="big">${total}</div></div></div><div class="card"><h2>Cardio de la semaine</h2><p class="muted">${weeklyCount('run')} sortie(s) de course enregistrée(s) · minimum visé : 1 par semaine. Le badminton est suivi séparément.</p></div><div class="card"><h2>Ton premier chapitre</h2><div class="bar"><div style="width:${Math.min(100,Math.round(startDay()/90*100))}%"></div></div><p class="small muted">${startDay()<=90?`Jour ${startDay()} sur 90` :startDay()<=180?`Premier chapitre terminé · consolidation J${startDay()} / 180`:'Progression continue après 180 jours'}</p><p class="small muted">${sports} missions sportives validées. Le temps écoulé ne suffit pas à prouver une transformation.</p></div><div class="card"><h2>Évolution des cinq attributs comportementaux</h2><p class="small muted">Le niveau reflète la difficulté des missions proposées, pas un diagnostic de personnalité. Trois missions jugées faciles font monter d’un niveau ; deux missions difficiles consécutives peuvent alléger le défi.</p>${['presence','maitrise','autonomie','resilience','liens'].map(k=>`<div class="listrow row"><strong>${esc(BEHAVIORS[k].name)}</strong><span class="pill">Niveau ${behaviorLevel(k)} / 5</span></div>`).join('')}<p class="small muted">Force : progression évaluée séparément par les tests physiques et les entraînements.</p></div><div class="card"><h2>Historique des actions</h2>${state.events.length?[...state.events].reverse().slice(0,40).map(e=>`<div class="listrow row"><span>${esc(e.date)} · ${esc(e.type==='sport'?CATALOG[e.key]?.name||'Sport':e.key)}</span><strong class="gold">+${e.xp} XP</strong></div>`).join(''):'<div class="empty">Aucune mission encore enregistrée.</div>'}</div>`}

tion/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='livre-aube-sauvegarde-'+today()+'.json';link.click();document.getElementById('accueil').innerHTML=renderHome();setTimeout(()=>URL.revokeObjectURL(url),2000)}});

// Rest timer uses absolute timestamps: it continues correctly across renders and background tabs.
let restEndAt=0,restPausedMs=90000,restHandle=null;
function restRemaining(){return restEndAt?Math.max(0,restEndAt-Date.now()):restPausedMs}
function restFormat(ms){let sec=Math.ceil(ms/1000);return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function restTick(){let ms=restRemaining();if(restEndAt&&!ms){restEndAt=0;restPausedMs=0;restExerciseKey=null;clearInterval(restHandle);restHandle=null;document.querySelectorAll('.inline-rest').forEach(el=>el.remove());return}document.querySelectorAll('[data-rest-clock]').forEach(el=>el.textContent=restFormat(ms));document.querySelectorAll('[data-rest-status]').forEach(el=>el.textContent=restEndAt?'Repos en cours':'En pause / prêt')}

function restStart(seconds){restPausedMs=Math.max(0,seconds*1000);restEndAt=Date.now()+restPausedMs;if(!restHandle)restHandle=setInterval(restTick,250);restTick()}
function restPauseToggle(){if(restEndAt){restPausedMs=restRemaining();restEndAt=0}else{restEndAt=Date.now()+restPausedMs;if(!restHandle)restHandle=setInterval(restTick,250)}restTick()}
let restExerciseKey=null;
function inlineRestTimer(key){if(restExerciseKey!==key||(!restEndAt&&restPausedMs<=0))return '';return `<div class="inline-rest" role="timer" aria-label="Repos de cet exercice"><div class="row" style="justify-content:space-between;align-items:center"><div><strong style="color:var(--gold)">⏱ Repos · ${esc(key.startsWith('body:')?'Exercice au poids du corps':'Salle')}</strong><div class="small muted" data-rest-status>Repos en cours</div></div><div class="timer-display" data-rest-clock>${restFormat(restRemaining())}</div></div><div class="row"><button class="btn sm secondary" data-v4="timer-start">Pause / Reprendre</button><button class="btn sm ghost" data-v4="timer-plus">+15 s</button><button class="btn sm ghost" data-v4="timer-90">Relancer</button><button class="btn sm ghost" data-v4="timer-dismiss">Fermer</button></div></div>`}

function bodyworkSignature(k,p){return [p.variant,p.kg,p.max,p.date,p.target,p.series].join('|')}
function bodyworkEntry(k,p){bodyworkInit();let x=state.bodywork[k];return x&&x.date===today()&&x.signature===bodyworkSignature(k,p)?x:null}
function bodyworkGrade(k,p){let x=bodyworkEntry(k,p);if(!x||!x.sets.length)return 'none';if(x.sets.some(z=>z.quality==='pain'))return 'pain';if(!x.sets.some(z=>z.count>0))return 'none';if(x.sets.length===p.series&&x.sets.every(z=>z.quality==='good'&&z.count>=p.target))return 'complete';return 'partial'}
function bodyworkComplete(k){let p=prescription(k);return !!p&&['complete','partial','pain'].includes(bodyworkGrade(k,p))}
function bodyworkCard(k,p){let x=bodyworkEntry(k,p),sets=x?.sets||[],unit=k==='planche'?'secondes':'répétitions';let finished=sets.length>=p.series;return `<div class="line"></div><div class="bodywork"><h3>Carnet de séries · ${sets.length}/${p.series}</h3><p class="small muted">${p.series} séries de ${p.target} ${unit} · une séance partielle sans douleur reste validable. Le repos démarre dès l'enregistrement d'une série.</p><div class="row">${Array.from({length:p.series},(_,i)=>`<span class="pill">S${i+1} ${sets[i]?(sets[i].count+' '+(sets[i].quality==='good'?'✓':sets[i].quality==='pain'?'⚠':'~')):'—'}</span>`).join('')}</div>${!finished&&!done(k)&&!sets.some(z=>z.quality==='pain')?`<div class="fields"><label>${unit==='secondes'?'Durée tenue (s)':'Répétitions effectuées'}<input id="body-count-${k}" class="field" type="number" min="0" max="9999" step="1" value="${p.target}"></label><label>Qualité<select class="field" id="body-quality-${k}"><option value="good">Propre, sans douleur</option><option value="mixed">Technique dégradée</option><option value="pain">Douleur / arrêt</option></select></label></div><button class="btn sm" data-body="set" data-key="${k}">✓ Série ${sets.length+1} terminée · repos auto</button>`:''}${inlineRestTimer('body:'+k)}${sets.length&&!done(k)?`<button class="btn sm ghost" data-body="undo" data-key="${k}">Annuler la dernière série</button>`:''}${finished&&!bodyworkComplete(k)&&!done(k)?`<div class="notice">Aucune répétition positive enregistrée : la mission ne peut pas être validée. En cas de douleur, tu peux enregistrer l’arrêt.</div>`:''}${bodyworkComplete(k)&&!done(k)?`<div class="notice">${bodyworkGrade(k,p)==='pain'?'⚠ Arrêt pour douleur : enregistrable sans XP. Ne poursuis pas cet exercice.':'✓ Effort réel enregistré : validation possible même avant trois séries.'}</div>`:''}</div>`}
function bodyworkRecord(k){let p=prescription(k);if(!p||done(k))return;let x=bodyworkEntry(k,p)||{date:today(),signature:bodyworkSignature(k,p),sets:[]};if(x.sets.length>=p.series)return;let count=Number(document.getElementById('body-count-'+k)?.value),quality=document.getElementById('body-quality-'+k)?.value;if(!Number.isInteger(count)||count<0||count>9999)return alert('Indique un nombre entier valide.');if(quality==='pain'&&!confirm('Douleur ressentie : interromps cet exercice. Enregistrer la série comme interrompue ?'))return;x.sets.push({count,quality,at:new Date().toISOString()});state.bodywork[k]=x;let remaining=x.sets.length<p.series;if(remaining&&quality!=='pain'){restExerciseKey='body:'+k;restStart(state.gym.restSeconds);}else if(quality==='pain'){restEndAt=0;restPausedMs=0;restTick()}save();render();}
document.addEventListener('click',e=>{let b=e.target.closest('[data-body]');if(!b)return;let k=b.dataset.key,p=prescription(k);if(!p||done(k))return;if(b.dataset.body==='set')bodyworkRecord(k);if(b.dataset.body==='undo'){let x=bodyworkEntry(k,p);if(x?.sets.length){x.sets.pop();save();render()}}});

document.addEventListener('click',e=>{const b=e.target.closest('[data-v4]');if(!b)return;let action=b.dataset.v4,id=b.dataset.id;
if(action==='gym-set'){let ex=gymTemplate().find(x=>x[0]===id);if(!ex)return;let w=safeNumber(document.getElementById('gym-weight-'+id).value,0,999),r=safeNumber(document.getElementById('gym-reps-'+id).value,1,999);let q=document.getElementById('gym-quality-'+id).value;if(q==='pain'&&!confirm('Douleur signalée : arrête cet exercice. Enregistrer cette série comme interrompue ?'))return;state.gym.active[id] ||= [];if(state.gym.active[id].length>=ex[3]){alert('Toutes les séries de cet exercice sont enregistrées.');return}state.gym.active[id].push({weight:w,reps:r,quality:q,at:new Date().toISOString()});restExerciseKey='gym:'+id;restStart(state.gym.restSeconds);save();render();}
if(action==='gym-edit'){document.getElementById('gym-editor')?.classList.toggle('hidden')}
if(action==='gym-edit-save'){let i=+b.dataset.index,sets=+document.getElementById('edit-sets-'+i).value,reps=+document.getElementById('edit-reps-'+i).value;if(!Number.isInteger(sets)||sets<1||sets>10||!Number.isInteger(reps)||reps<1||reps>300){alert('Séries : 1–10 ; répétitions : 1–300.');return}let template=editTemplate();template[i][3]=sets;template[i][4]=reps;save();render();document.getElementById('gym-editor')?.classList.remove('hidden')}
if(action==='gym-remove'){let i=+b.dataset.index;if(!confirm('Retirer cet exercice du programme ? Les séries enregistrées restent dans l’historique.'))return;editTemplate().splice(i,1);save();render();document.getElementById('gym-editor')?.classList.remove('hidden')}
if(action==='gym-add'){let name=prompt('Nom du nouvel exercice :');if(!name||!name.trim())return;name=name.trim().slice(0,70);let count=+prompt('Nombre de séries (1–10) :','3'),reps=+prompt('Répétitions par série (1–300) :','10');if(!Number.isInteger(count)||count<1||count>10||!Number.isInteger(reps)||reps<1||reps>300){alert('Valeurs incorrectes.');return}editTemplate().push([nextGymId(),name,'kg',count,reps]);save();render();document.getElementById('gym-editor')?.classList.remove('hidden')}
if(action==='gym-reset'){if(confirm('Restaurer le modèle de la séance ?')){delete state.gym.custom[state.gym.session];save();render()}}
if(action==='gym-delete'){let stamp=b.dataset.stamp;let h=state.gym.history.find(x=>x.stamp===stamp);if(!h)return;if(!confirm('Supprimer définitivement cette séance et toutes ses séries enregistrées ?'))return;state.gym.history=state.gym.history.filter(x=>x.stamp!==stamp);state.gym.entries=state.gym.entries.filter(x=>x.stamp!==stamp);save();render();}
if(action==='gym-clear'){if(confirm('Effacer uniquement les séries en cours ?')){state.gym.active={};save();render()}}
if(action==='gym-finish'){restEndAt=0;restPausedMs=0;restExerciseKey=null;clearInterval(restHandle);restHandle=null;let items=Object.entries(state.gym.active).filter(([,sets])=>sets.length);if(!items.length){alert('Enregistre au moins une série.');return}let stamp=new Date().toISOString(),volume=0,count=0;for(let [id,sets] of items){state.gym.entries.push({id,date:today(),stamp,sets});count+=sets.length;if(id!=='plank')volume+=sets.reduce((a,x)=>a+x.weight*x.reps,0)}state.gym.history.push({date:today(),stamp,session:state.gym.session,count,volume});state.gym.active={};narrator('gym');save();render();alert('Séance enregistrée.');}
if(action==='run-save'){let date=document.getElementById('run-date').value,minutes=+document.getElementById('run-minutes').value,distance=+document.getElementById('run-distance').value,effort=+document.getElementById('run-effort').value,note=document.getElementById('run-note').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today()||!Number.isFinite(minutes)||minutes<1||minutes>600||!Number.isFinite(distance)||distance<0||distance>150||!Number.isInteger(effort)||effort<1||effort>10){alert('Vérifie la date, la durée, la distance et l’effort.');return}state.runs.push({date,minutes,distance,effort,note});narrator('run');save();render();}
if(action==='check-save'){let ratings={};for(let k of Object.keys(ATTRIBUTE_NAMES)){let v=+document.getElementById('check-'+k).value;if(!Number.isInteger(v)||v<1||v>5){alert('Évalue les six attributs avant de valider.');return}ratings[k]=v}let note=document.getElementById('check-note').value.trim();if(!note){alert('Ajoute au moins un exemple concret ou une difficulté rencontrée.');return}state.checkins[today()]={date:today(),day:startDay(),ratings,note};narrator('check');save();render();}
if(action.startsWith('timer-')){if(action==='timer-start')restPauseToggle();if(action==='timer-90')restStart(state.gym.restSeconds);if(action==='timer-dismiss'){restEndAt=0;restPausedMs=0;restExerciseKey=null;clearInterval(restHandle);restHandle=null;document.querySelectorAll('.inline-rest').forEach(el=>el.remove())}if(action==='timer-plus'){let ms=restRemaining()+15000;restPausedMs=ms;if(restEndAt)restEndAt=Date.now()+ms;restTick()}}
});
document.addEventListener('change',e=>{if(e.target.id==='rest-duration'){state.gym.restSeconds=+e.target.value;save()}if(e.target.id==='gym-frequency'){state.gym.frequency=+e.target.value;if(!workoutDays().includes(state.gym.session))state.gym.session='A';save();render()}if(e.target.id==='gym-session'){state.gym.session=e.target.value;save();render()}if(e.target.dataset.v4Change==='recovery'){state.recovery[e.target.dataset.key]=+e.target.value;save();render()}});

document.addEventListener('click',e=>{let b=e.target.closest('[data-v11]');if(!b)return;planInit();v4init();let kind=b.dataset.kind;if(b.dataset.v11!=='toggle'||!['gym','badminton','run','rest'].includes(kind))return;let d=today(),flags=state.activityDays[d]||{};if(kind==='gym'&&state.gym.history.some(x=>x.date===d)){alert('La séance de salle est déjà enregistrée dans le journal.');return}if(kind==='run'&&state.runs.some(x=>x.date===d)){alert('La sortie est déjà enregistrée dans le journal.');return}if(!flags[kind]&&kind==='gym'&&weeklyCount('gym')>=2){if(!confirm('Tu as déjà déclaré deux jours de salle cette semaine. Enregistrer quand même cette séance exceptionnelle ?'))return}flags[kind]=!flags[kind];if(kind==='rest'&&flags.rest){flags.gym=false;flags.badminton=false;flags.run=false}else if(flags[kind])flags.rest=false;state.activityDays[d]=flags;save();render()});
document.addEventListener('click',e=>{let b=e.target.closest('[data-v8]');if(!b)return;state.dailyModes ||= {};state.extraOpen ||= {};if(b.dataset.v8==='mode'){state.dailyModes[today()]=b.dataset.mode;state.extraOpen[today()]=false;ensureBehaviorAssignments();}if(b.dataset.v8==='extra'){state.extraOpen[today()]=!optionalOpen();ensureBehaviorAssignments();}save();render();});

// V12 : missions comportementales ciblées et bilans comparatifs.
function v12init(){state.v12 ||= {priorities:['maitrise','presence'],contexts:{},notes:{},skipped:{}};for(const k of ['contexts','notes','skipped'])if(!state.v12[k]||typeof state.v12[k]!=='object')state.v12[k]={};if(!Array.isArray(state.v12.priorities))state.v12.priorities=['maitrise','presence'];}
const v12Keys=['presence','maitrise','autonomie','resilience','liens'];
function dailyBehaviorKeys(){v12init();const selected=[...new Set(state.v12.priorities.filter(k=>v12Keys.includes(k)))].slice(0,2);const fallback=v12Keys.filter(k=>!selected.includes(k));while(selected.length<2)selected.push(fallback.shift());const day=Math.max(0,days(state.started,today()));const priorities=day%2?[selected[1],selected[0]]:selected;const rest=v12Keys.filter(k=>!selected.includes(k));const rotating=rest[(day+Math.floor(day/28))%rest.length];return [...priorities,rotating].slice(0,behaviorCount())}
function v12PrioritiesPanel(){v12init();return `<div class="card"><div class="eyebrow">Parcours mental</div><h2>Mes deux priorités pour les prochaines semaines</h2><p class="small muted">Concentre tes efforts sur deux dimensions. Les autres restent accessibles en missions bonus. Tu peux modifier ce choix à tout moment.</p><div class="fields">${[0,1].map(i=>`<label>Priorité ${i+1}<select class="field" data-v12-priority="${i}">${v12Keys.map(k=>`<option value="${k}" ${state.v12.priorities[i]===k?'selected':''}>${esc(BEHAVIORS[k].name)}</option>`).join('')}</select></label>`).join('')}</div><p class="small muted">Après le niveau 5, tu continues à pratiquer dans de nouveaux contextes : il n’existe pas de personnalité « terminée ».</p></div>`}
function bilanExtras(){v4init();let checks=Object.values(state.checkins).filter(x=>x&&x.date&&x.ratings).sort((a,b)=>a.date.localeCompare(b.date));let first=checks[0],last=checks.at(-1);let compare=`<div class="card"><h2>J1 → Aujourd’hui : comparaison</h2>${first&&last?`<p class="small muted">Référence du ${esc(first.date)} · Dernier bilan du ${esc(last.date)}. Ces notes sont des ressentis, pas des diagnostics.</p>${Object.entries(ATTRIBUTE_NAMES).map(([k,name])=>{let a=Number(first.ratings?.[k]),b=Number(last.ratings?.[k]);let diff=Number.isFinite(a)&&Number.isFinite(b)?b-a:null;return `<div class="listrow row"><span>${esc(name)}</span><strong>${Number.isFinite(a)?a:'—'} → ${Number.isFinite(b)?b:'—'} / 5 ${diff===null?'':`<span class="${diff>0?'ok':'muted'}">(${diff>0?'+':''}${diff})</span>`}</strong></div>`}).join('')}<div class="line"></div><h3>Preuves concrètes</h3><p class="small muted"><strong>Départ :</strong> ${esc(first.note||'Aucune')}</p><p class="small muted"><strong>Dernier bilan :</strong> ${esc(last.note||'Aucune')}</p>`:'<p class="muted">Enregistre ton premier bilan, puis un autre plus tard pour voir une comparaison réelle.</p>'}</div>`;
let evidence=Object.entries(state.missions).filter(([id,m])=>m&&m.feedback&&m.note).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,12);let proofs=`<div class="card"><h2>Journal des preuves</h2><p class="small muted">Les petites actions concrètes sont plus utiles qu’une note abstraite.</p>${evidence.length?evidence.map(([id,m])=>`<div class="listrow"><strong>${esc(m.date)} · ${esc(BEHAVIORS[m.key]?.name||m.key)}</strong><p class="small muted">${esc(m.note)}</p></div>`).join(''):'<p class="muted">Ajoute une phrase facultative lors d’une mission comportementale pour alimenter ce journal.</p>'}</div>`;
return compare+proofs}
function renderBilans(){return bilanForm()+bilanExtras()}
function profilMental(){return `<div class="card"><h2>Parcours mental</h2><p class="muted small">Tes priorités sont modifiables depuis l’onglet Missions. Les bilans sont des observations personnelles ; en cas de détresse persistante, fais-toi accompagner par un professionnel qualifié.</p><button class="btn secondary sm" data-action="go" data-target="missions">Choisir mes priorités</button></div>`}
function profilRepos(){v4init();return `<div class="card"><h2>Paramètres du repos</h2><label>Durée automatique entre les séries <select class="field" id="rest-duration">${[30,45,60,75,90,120,150,180,240,300].map(n=>`<option value="${n}" ${state.gym.restSeconds===n?'selected':''}>${n} secondes</option>`).join('')}</select></label><p class="small muted">Le chrono s'affiche sous l'exercice après chaque série et disparaît automatiquement à zéro.</p></div>`}
function renderProfil(){return profilMain()+profilMental()+profilRepos()}
document.addEventListener('change',e=>{v12init();let el=e.target;if(el.matches('[data-v12-priority]')){let idx=Number(el.dataset.v12Priority),key=el.value;if(!v12Keys.includes(key))return;let next=[...state.v12.priorities];next[idx]=key;if(next[0]===next[1]){alert('Choisis deux attributs différents.');render();return;}state.v12.priorities=next;save();render();}if(el.matches('[data-v12-context]')){state.v12.contexts[el.dataset.v12Context]=el.value.trim().slice(0,180);save();}if(el.matches('[data-v12-note]')){state.v12.notes[el.dataset.v12Note]=el.value.trim().slice(0,400);save();}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-v12="skip"]');if(!b)return;v12init();let k=b.dataset.key,id=behaviorMission(k).id;let field=document.querySelector(`[data-v12-note="${id}"]`);if(field)state.v12.notes[id]=field.value.trim().slice(0,400);if(state.v12.skipped[id])delete state.v12.skipped[id];else state.v12.skipped[id]=true;save();render();});
// Conserver le suivi de version sans modifier la clé de stockage locale.


// V12.4 — parcours simplifié : cinq rubriques, écrans spécialisés.
function renderProgramme(){
  const pr=program();
  return headerBlock('TON PROGRAMME','Micro-workouts adaptés à tes activités et à ta récupération.')
    +activityPanel()+modePanel()
    +`<div class="card"><h2>Ta séance du jour</h2><p class="small muted">${pr.length?'Enregistre chaque série, puis valide les exercices réalisés.':'Pas de micro-workout prévu aujourd’hui. La récupération compte aussi.'}</p></div>`
    +`<div class="grid">${pr.map(x=>exerciseCard(x.key,'mission')).join('')}</div>`;
}
function renderMissions(){
  return headerBlock('ESPRIT & CARACTÈRE','Deux priorités comportementales et des preuves concrètes, à ton rythme.')
  +v12PrioritiesPanel()
  +`<div class="card"><h2>Les actions du jour</h2><p class="small muted">Une mission en mode normal, jusqu’à trois en mode complet. Choisis un défi réalisable, sans chercher la perfection.</p>${dailyBehaviorKeys().map(behaviorRow).join('')}</div>`
  +`<div class="card"><button class="btn secondary" data-action="go" data-target="bilans">Consulter mon journal des preuves</button></div>`;
}

ensureBehaviorAssignments();render();go('accueil');
</script></body></html>
