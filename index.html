<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hunter System v2</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0f1923; --bg2: #1a2535; --bg3: #1e2d42;
      --accent: #00d4ff; --accent2: #0099cc;
      --green: #2ed573; --orange: #ffa502; --red: #ff4757;
      --purple: #a29bfe; --gold: #ffd700; --text: #e0e0e0; --muted: #7f8c9a;
      --nav-h: 65px;
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: var(--nav-h); }

    /* ===== HEADER ===== */
    .header {
      background: var(--bg2); padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(0,212,255,0.15);
      position: sticky; top: 0; z-index: 100;
    }
    .header-row1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .lvl-badge {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-weight: 800; font-size: 0.95em;
      padding: 6px 14px; border-radius: 20px; letter-spacing: 1px;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .streak-badge {
      background: rgba(255,165,2,0.15); border: 1px solid var(--orange);
      color: var(--orange); padding: 5px 12px; border-radius: 20px;
      font-weight: 700; font-size: 0.9em;
    }
    .cycle-badge {
      background: rgba(162,155,254,0.15); border: 1px solid var(--purple);
      color: var(--purple); padding: 5px 10px; border-radius: 20px;
      font-weight: 700; font-size: 0.82em; white-space: nowrap;
    }
    .settings-ico {
      background: rgba(255,255,255,0.08); border: none; color: var(--text);
      width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
      font-size: 1.1em; transition: background 0.2s;
    }
    .settings-ico:hover { background: rgba(255,255,255,0.15); }
    .xp-row { display: flex; align-items: center; gap: 10px; }
    .xp-label { font-size: 0.78em; color: var(--muted); white-space: nowrap; }
    .xp-bar-wrap { flex: 1; height: 8px; background: rgba(0,0,0,0.4); border-radius: 4px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.5s; }

    /* ===== PAGES ===== */
    .page { display: none; padding: 16px; animation: fadeIn 0.25s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* ===== CARDS ===== */
    .card { background: var(--bg2); border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.07); }
    .card-title { font-size: 0.85em; color: var(--accent); font-weight: 700; margin-bottom: 10px; }

    /* ===== BUTTONS ===== */
    .btn-primary {
      width: 100%; padding: 13px; border-radius: 11px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-weight: 700; font-size: 1em; cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { background: #2a3444; color: var(--muted); cursor: not-allowed; }
    .gen-btn {
      width: 100%; padding: 18px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff; font-size: 1.15em; font-weight: 800; cursor: pointer;
      letter-spacing: 0.5px; transition: all 0.3s; margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .gen-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(124,58,237,0.6); }
    .gen-btn:disabled { background: #2a3444; color: var(--muted); cursor: not-allowed; }

    /* ===== QUÊTES ===== */
    .quest-card {
      background: var(--bg2); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .quest-card.done { opacity: 0.55; border-color: var(--green); }
    .quest-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .quest-name { font-weight: 700; font-size: 1.05em; }
    .quest-xp { background: rgba(0,212,255,0.15); color: var(--accent); padding: 3px 10px; border-radius: 12px; font-size: 0.82em; font-weight: 700; }
    .quest-desc { color: #aab; font-size: 0.88em; line-height: 1.55; margin-bottom: 12px; }
    .quest-btn {
      width: 100%; padding: 11px; border-radius: 9px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-weight: 700; cursor: pointer; font-size: 0.95em;
    }
    .quest-btn:hover { opacity: 0.85; }
    .quest-btn:disabled { background: #2a3444; color: var(--muted); cursor: not-allowed; }

    /* ===== FORMS ===== */
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 0.82em; color: var(--muted); margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; padding: 11px 14px; background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
      color: var(--text); font-size: 0.95em;
    }
    .form-input:focus { outline: none; border-color: var(--accent); }

    /* ===== EXERCICE EDITOR ===== */
    .exercise-group {
      background: var(--bg2); border-radius: 12px; padding: 14px;
      margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.07);
    }
    .exercise-group-title { font-weight: 700; font-size: 0.95em; margin-bottom: 10px; color: var(--accent); }
    .exercise-list { display: flex; flex-direction: column; gap: 8px; }
    .exercise-item {
      background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px; padding: 10px 12px; display: flex; align-items: center; gap: 8px;
      cursor: pointer; font-size: 0.88em;
    }
    .exercise-item input { cursor: pointer; accent-color: var(--accent); }
    .exercise-item:has(input:checked) { border-color: var(--accent); background: rgba(0,212,255,0.08); }

    /* ===== STATS ===== */
    .stat-row {
      background: var(--bg2); border-radius: 12px; padding: 14px 16px;
      border-left: 4px solid; display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
    }
    .stat-row.force { border-color: var(--red); }
    .stat-row.endurance { border-color: var(--orange); }
    .stat-row.agility { border-color: var(--accent); }
    .stat-row.perception { border-color: var(--green); }
    .stat-row.intelligence { border-color: var(--purple); }
    .stat-icon { font-size: 1.4em; }
    .stat-info { flex: 1; }
    .stat-name { font-size: 0.78em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
    .stat-val { font-size: 1.5em; font-weight: 800; }
    .stat-bar { height: 5px; background: rgba(0,0,0,0.4); border-radius: 3px; margin-top: 4px; }
    .stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .stat-row.force .stat-bar-fill { background: var(--red); }
    .stat-row.endurance .stat-bar-fill { background: var(--orange); }
    .stat-row.agility .stat-bar-fill { background: var(--accent); }
    .stat-row.perception .stat-bar-fill { background: var(--green); }
    .stat-row.intelligence .stat-bar-fill { background: var(--purple); }

    /* ===== MODALES ===== */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 500; padding: 20px; align-items: flex-end; }
    .modal.active { display: flex; }
    .modal-sheet {
      background: var(--bg3); border-radius: 20px 20px 0 0; width: 100%;
      max-height: 90vh; overflow-y: auto; padding: 24px 20px 30px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 20px; }
    .modal-title { font-size: 1.2em; font-weight: 700; margin-bottom: 20px; color: var(--accent); }

    /* ===== NAV ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
      background: var(--bg2); border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; z-index: 200;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px; cursor: pointer; border: none;
      background: transparent; color: var(--muted); font-size: 0.72em;
      font-weight: 600; transition: color 0.2s; padding: 8px 0;
    }
    .nav-item .nav-icon { font-size: 1.5em; }
    .nav-item.active { color: var(--accent); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + 12px); left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1e3a2e; border: 1px solid var(--green); color: var(--green);
      padding: 11px 22px; border-radius: 30px; font-size: 0.9em; font-weight: 600;
      z-index: 999; opacity: 0; transition: all 0.3s; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #3a1e1e; border-color: var(--red); color: var(--red); }

    /* ===== LOADING ===== */
    #loadingOverlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      z-index: 999; flex-direction: column; align-items: center; justify-content: center;
    }
    #loadingOverlay.active { display: flex; }
    .spinner { width: 48px; height: 48px; border: 4px solid rgba(0,212,255,0.15); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .section-title { font-size: 1.1em; font-weight: 700; color: var(--accent); margin-bottom: 14px; margin-top: 6px; }
    .hint { text-align: center; color: var(--muted); font-size: 0.88em; padding: 10px; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-row1">
      <div class="lvl-badge" id="lvlBadge">LVL 1</div>
      <div class="header-right">
        <div class="cycle-badge" id="cycleBadge">S1/4</div>
        <div class="streak-badge" id="streakBadge">🔥 0</div>
        <button class="settings-ico" onclick="APP.openSettings()">⚙️</button>
      </div>
    </div>
    <div class="xp-row">
      <span class="xp-label" id="xpLabel">XP 0/500</span>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- PAGE : HOME -->
  <div class="page active" id="pageHome">
    <div style="background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(79,70,229,0.1)); border: 1px solid rgba(124,58,237,0.3); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px;">
      <div style="font-size: 0.75em; color: var(--muted); margin-bottom: 3px;">FOCUS DU JOUR</div>
      <div id="focusBannerVal" style="font-size: 1em; font-weight: 700; color: #c4b5fd;">Push</div>
      <div id="focusBannerDay" style="font-size: 0.8em; color: var(--muted); margin-top: 4px;">lundi</div>
    </div>

    <button class="gen-btn" id="genBtn" onclick="APP.generateProgram()">⚡ GÉNÉRER PROGRAMME</button>

    <div id="questsWrap"></div>
    <div id="hintWrap" class="hint">Lance la génération pour recevoir tes quêtes ✦</div>
  </div>

  <!-- PAGE : STATS -->
  <div class="page" id="pageStats">
    <div class="section-title">📊 Progression des Stats</div>
    <div id="statsWrap"></div>
  </div>

  <!-- PAGE : EXERCICES -->
  <div class="page" id="pageExercices">
    <div class="section-title">🏋️ Personnaliser les exercices</div>
    <p style="color: var(--muted); font-size: 0.88em; margin-bottom: 16px;">Coche les exercices que tu veux inclure. Les exercices non cochés seront exclus des quêtes.</p>
    <div id="exerciceEditWrap"></div>
    <button class="btn-primary" onclick="APP.saveExercicePrefs()">💾 Enregistrer</button>
  </div>

  <!-- PAGE : HISTORIQUE -->
  <div class="page" id="pageHistorique">
    <div class="section-title">📜 Historique</div>
    <div id="historyWrap"></div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="navHome" onclick="APP.goPage('Home')"><span class="nav-icon">🏠</span>Accueil</button>
    <button class="nav-item" id="navStats" onclick="APP.goPage('Stats')"><span class="nav-icon">📊</span>Stats</button>
    <button class="nav-item" id="navExercices" onclick="APP.goPage('Exercices')"><span class="nav-icon">🏋️</span>Exercices</button>
    <button class="nav-item" id="navHistorique" onclick="APP.goPage('Historique')"><span class="nav-icon">📜</span>Historique</button>
  </nav>

  <!-- MODAL SETTINGS -->
  <div class="modal" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">⚙️ Paramètres</div>

      <div class="form-group">
        <label class="form-label">🔑 Clé API OpenRouter</label>
        <input type="password" class="form-input" id="apiKeyInput" placeholder="sk-or-v1-...">
      </div>

      <div class="form-group">
        <label class="form-label">🩹 Blessure actuelle</label>
        <input type="text" class="form-input" id="injuryInput" placeholder="Ex: Épaule droite">
      </div>

      <div class="form-group">
        <label class="form-label">🏋️ Équipement</label>
        <div id="equipmentCheckboxes" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
      </div>

      <button class="btn-primary" onclick="APP.saveSettings()">💾 Enregistrer</button>
      <button class="btn-primary" onclick="APP.resetAll()" style="background: rgba(255,71,87,0.15); border: 1px solid var(--red); color: var(--red); margin-top: 16px;">🔄 Réinitialiser</button>
      <button onclick="APP.closeSettings()" style="width:100%; padding:12px; background:none; border:none; color:var(--muted); cursor:pointer; margin-top:10px;">Annuler</button>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="color: var(--accent); margin-top: 16px;">Génération...</div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const CONFIG = {
  XP_PER_LEVEL: 500,
  EQUIPMENT: { none:'Poids du corps', pullup:'Barre traction', dips:'Barre de dips', rings:'Anneaux', dumbbells:'Haltères', bands:'Élastiques', chair:'Chaise' },

  PALIERS: {
    push: { name:'Push', icon:'💪', steps:['Pompes genoux','Pompes classiques','Pompes déclinées','Pompes diamant','Pompes pike','Pseudo-planche pompes','Pompes explosives','Pompes wide'] },
    pull: { name:'Pull', icon:'🔙', steps:['Superman','Rowing sur table','Tractions australiennes','Tractions négatives','Tractions pronation','Tractions supination','Tractions lestées','Muscle-up'] },
    legs: { name:'Jambes', icon:'🦵', steps:['Squats classiques','Squats sumo','Wall sit','Fentes avant','Squats bulgares','Squats jump','Pistol squat assisté','Pistol squat'] },
    core: { name:'Core', icon:'🧱', steps:['Planche 20s','Planche 45s','Hollow body','Dead bug','Planche latérale','Leg raises','Dragon flag neg','L-sit'] },
    mobility: { name:'Mobilité', icon:'🌿', steps:['Étirements 5min','Cat-cow','World greatest stretch','Hanches 90/90','Mobilité thoracique','Routine 10min','Yoga flow','Yoga avancé'] }
  },

  EXERCISE_VARIATIONS: {
    push: ['pompes classiques','pompes déclinées','pompes diamant','pompes pike','pompes explosives','dumbbell bench press','dumbbell floor press'],
    pull: ['tractions pronation','tractions supination','tractions australiennes','dead hang','hanging knee raise','dumbbell rows','single arm rows'],
    legs: ['squats classiques','squats sumo','squats jump','fentes avant','squats bulgares','dumbbell squats','goblet squats'],
    core: ['planche frontale','planche latérale','hollow body','leg raises','mountain climbers','dumbbell rotations','dumbbell chop']
  },

  EXERCISE_EQUIPMENT: {
    'dumbbell bench press': 'dumbbells',
    'dumbbell floor press': 'dumbbells',
    'dumbbell rows': 'dumbbells',
    'single arm rows': 'dumbbells',
    'dumbbell squats': 'dumbbells',
    'goblet squats': 'dumbbells',
    'dumbbell rotations': 'dumbbells',
    'dumbbell chop': 'dumbbells'
  },

  DAY_FOCUS: {
    0: { focus:'Repos actif', desc:'Récupération', groups:[] },
    1: { focus:'Entraînement', desc:'4 exercices', groups:['push','pull','legs','core'] },
    2: { focus:'Entraînement', desc:'4 exercices', groups:['push','pull','legs','core'] },
    3: { focus:'Entraînement', desc:'4 exercices', groups:['push','pull','legs','core'] },
    4: { focus:'Entraînement', desc:'4 exercices', groups:['push','pull','legs','core'] },
    5: { focus:'Entraînement', desc:'4 exercices', groups:['push','pull','legs','core'] },
    6: { focus:'Entraînement', desc:'4 exercices', groups:['push','pull','legs','core'] }
  }
};

// ===== STATE =====
let STATE = {
  apiKey: '',
  injury: '',
  equipment: ['none'],
  stats: { force:1, endurance:1, agility:1, perception:1, intelligence:1 },
  statsXP: { force:0, endurance:0, agility:0, perception:0, intelligence:0 },
  streak: 0,
  lastStreakDate: null,
  todayQuests: [],
  questsDone: [],
  lastGenDate: null,
  cycleStartDate: null,
  cycleNumber: 1,
  activityLog: [],
  exercicePrefs: {}
};

// ===== UTILS =====
const UTILS = {
  today: () => new Date().toISOString().split('T')[0],
  save: () => localStorage.setItem('hs_v2', JSON.stringify(STATE)),
  load: () => { const d = localStorage.getItem('hs_v2'); if(d) STATE = {...STATE, ...JSON.parse(d)}; },
  toast: (msg, err=false) => {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (err ? ' error' : '');
    setTimeout(() => t.classList.remove('show'), 3200);
  },
  avgLevel: () => {
    const s = STATE.stats;
    return Math.floor((s.force+s.endurance+s.agility+s.perception+s.intelligence)/5);
  },
  addStatXP: (stat, xp) => {
    STATE.statsXP[stat] += xp;
    while(STATE.statsXP[stat] >= CONFIG.XP_PER_LEVEL){
      STATE.statsXP[stat] -= CONFIG.XP_PER_LEVEL;
      STATE.stats[stat]++;
      UTILS.toast('⬆️ '+stat.toUpperCase()+' niv '+STATE.stats[stat]);
    }
  }
};

// ===== GAME LOGIC =====
const GAME = {
  getCycleInfo: () => {
    if(!STATE.cycleStartDate) STATE.cycleStartDate = UTILS.today();
    const start = new Date(STATE.cycleStartDate);
    const diffDays = Math.floor((new Date() - start) / 86400000);
    const week = Math.min(4, Math.floor(diffDays / 7) + 1);
    if(diffDays >= 28){
      STATE.cycleStartDate = UTILS.today();
      STATE.cycleNumber++;
      return GAME.getCycleInfo();
    }
    return { week, isDecharge: week === 4 };
  },
  getTodayFocus: () => {
    const day = new Date().getDay();
    const focus = CONFIG.DAY_FOCUS[day];
    return { ...focus, dayName: ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'][day] };
  },
  getCurrentPalier: (pattern) => {
    const lvl = STATE.stats[['force','force','agility','perception','intelligence'][['push','pull','legs','core','mobility'].indexOf(pattern)]] || 1;
    let idx = 0;
    if(lvl >= 2) idx = 1;
    if(lvl >= 4) idx = 2;
    if(lvl >= 6) idx = 3;
    if(lvl >= 9) idx = 4;
    if(lvl >= 12) idx = 5;
    if(lvl >= 16) idx = 6;
    if(lvl >= 20) idx = 7;
    return CONFIG.PALIERS[pattern].steps[Math.min(idx, CONFIG.PALIERS[pattern].steps.length - 1)];
  },
  getVariationByLevel: (group) => {
    const lvl = UTILS.avgLevel();
    const variations = CONFIG.EXERCISE_VARIATIONS[group];
    let idx = Math.min(Math.floor(lvl / 3), variations.length - 1);
    const exercise = variations[idx];

    // Vérifier équipement
    const requiredEquip = CONFIG.EXERCISE_EQUIPMENT[exercise];
    if(requiredEquip && !STATE.equipment.includes(requiredEquip)) {
      // Retourner la première variation sans équipement
      for(let i = 0; i < variations.length; i++){
        if(!CONFIG.EXERCISE_EQUIPMENT[variations[i]]) return variations[i];
      }
    }
    return exercise;
  },

  getPool: () => {
    const focus = GAME.getTodayFocus();
    if(!focus.groups.length) return []; // Repos

    let exercises = [];
    focus.groups.forEach(g => {
      const ex = GAME.getVariationByLevel(g);
      if(!STATE.exercicePrefs[g] || STATE.exercicePrefs[g][ex] !== false){
        exercises.push(ex);
      }
    });
    return exercises;
  }
};

// ===== UI =====
const UI = {
  updateHeader: () => {
    const lvl = UTILS.avgLevel();
    const cycle = GAME.getCycleInfo();
    const avgXP = Object.values(STATE.statsXP).reduce((a,b)=>a+b,0)/5;
    document.getElementById('lvlBadge').textContent = 'LVL '+lvl;
    document.getElementById('streakBadge').textContent = '🔥 '+STATE.streak;
    document.getElementById('cycleBadge').textContent = 'S'+cycle.week+'/4';
    document.getElementById('xpFill').style.width = (avgXP/CONFIG.XP_PER_LEVEL*100)+'%';
    document.getElementById('xpLabel').textContent = 'XP '+Math.floor(avgXP)+'/'+CONFIG.XP_PER_LEVEL;
  },
  updateFocus: () => {
    const f = GAME.getTodayFocus();
    document.getElementById('focusBannerVal').textContent = f.focus+' — '+f.desc;
    document.getElementById('focusBannerDay').textContent = f.dayName;
  },
  updateStats: () => {
    const wrap = document.getElementById('statsWrap');
    wrap.innerHTML = '';
    ['force','endurance','agility','perception','intelligence'].forEach(s => {
      const icons = {force:'💪',endurance:'🏃',agility:'⚡',perception:'👁️',intelligence:'🧠'};
      const div = document.createElement('div');
      div.className = 'stat-row '+s;
      div.innerHTML =
        '<div class="stat-icon">'+icons[s]+'</div>'+
        '<div class="stat-info">'+
          '<div class="stat-name">'+s.toUpperCase()+'</div>'+
          '<div class="stat-val">'+STATE.stats[s]+'</div>'+
          '<div class="stat-bar"><div class="stat-bar-fill" style="width:'+(STATE.statsXP[s]/CONFIG.XP_PER_LEVEL*100)+'%"></div></div>'+
        '</div>'+
        '<div style="font-size:0.75em; color:var(--muted); white-space:nowrap;">'+STATE.statsXP[s]+'/'+CONFIG.XP_PER_LEVEL+'</div>';
      wrap.appendChild(div);
    });
  },
  renderQuests: () => {
    const w = document.getElementById('questsWrap');
    const h = document.getElementById('hintWrap');
    if(!STATE.todayQuests.length){ w.innerHTML = ''; h.style.display = 'block'; return; }
    h.style.display = 'none';
    w.innerHTML = '';
    STATE.todayQuests.forEach((q, i) => {
      const d = document.createElement('div');
      d.className = 'quest-card'+(STATE.questsDone[i]?' done':'');
      d.innerHTML =
        '<div class="quest-head"><div class="quest-name">'+q.name+'</div><div class="quest-xp">+'+q.xp+'</div></div>'+
        '<div class="quest-desc">'+q.description+'</div>'+
        '<button class="quest-btn" onclick="APP.doneQuest('+i+')" '+(STATE.questsDone[i]?'disabled':'')+'>'+
        (STATE.questsDone[i]?'✓ Done':'✓ Marquer')+' </button>';
      w.appendChild(d);
    });
  },
  renderExercices: () => {
    const wrap = document.getElementById('exerciceEditWrap');
    wrap.innerHTML = '';
    Object.keys(CONFIG.EXERCISE_VARIATIONS).forEach(g => {
      if(!STATE.exercicePrefs[g]) STATE.exercicePrefs[g] = {};
      const div = document.createElement('div');
      div.className = 'exercise-group';
      div.innerHTML = '<div class="exercise-group-title">'+CONFIG.PALIERS[g].icon+' '+CONFIG.PALIERS[g].name+'</div>';
      const list = document.createElement('div');
      list.className = 'exercise-list';
      CONFIG.EXERCISE_VARIATIONS[g].forEach(ex => {
        const checked = STATE.exercicePrefs[g][ex] !== false;
        const label = document.createElement('label');
        label.className = 'exercise-item';
        label.innerHTML = '<input type="checkbox" data-g="'+g+'" data-e="'+ex+'" '+(checked?'checked':'')+'><span>'+ex+'</span>';
        list.appendChild(label);
      });
      div.appendChild(list);
      wrap.appendChild(div);
    });
  },
  renderHistory: () => {
    const wrap = document.getElementById('historyWrap');
    if(!STATE.activityLog.length){ wrap.innerHTML = '<div class="hint">Aucune activité.</div>'; return; }
    const byDate = {};
    STATE.activityLog.forEach(a => { if(!byDate[a.date]) byDate[a.date] = []; byDate[a.date].push(a); });
    let html = '';
    Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).forEach(date => {
      const d = new Date(date);
      const label = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
      html += '<div style="margin-bottom:18px;"><div style="font-size:0.8em; color:var(--muted); font-weight:600; margin-bottom:8px;">'+label+'</div>';
      byDate[date].forEach(a => {
        html += '<div style="background:var(--bg2); border-radius:10px; padding:12px; margin-bottom:6px; display:flex; justify-content:space-between;"><span>'+a.name+'</span><span style="color:var(--accent); font-weight:700;">+'+a.xp+'</span></div>';
      });
      html += '</div>';
    });
    wrap.innerHTML = html;
  }
};

// ===== APP =====
const APP = {
  openSettings: () => {
    document.getElementById('apiKeyInput').value = STATE.apiKey;
    document.getElementById('injuryInput').value = STATE.injury;
    const eq = document.getElementById('equipmentCheckboxes');
    eq.innerHTML = '';
    Object.keys(CONFIG.EQUIPMENT).forEach(k => {
      const label = document.createElement('label');
      label.style.cssText = 'display:flex; gap:8px; cursor:pointer; font-size:0.88em;';
      label.innerHTML = '<input type="checkbox" value="'+k+'" '+(STATE.equipment.includes(k)?'checked':'')+'> '+CONFIG.EQUIPMENT[k];
      eq.appendChild(label);
    });
    document.getElementById('settingsModal').classList.add('active');
  },
  closeSettings: () => document.getElementById('settingsModal').classList.remove('active'),
  saveSettings: () => {
    STATE.apiKey = document.getElementById('apiKeyInput').value.trim();
    STATE.injury = document.getElementById('injuryInput').value.trim();
    STATE.equipment = [];
    document.querySelectorAll('#equipmentCheckboxes input:checked').forEach(cb => STATE.equipment.push(cb.value));
    if(!STATE.equipment.length) STATE.equipment = ['none'];
    UTILS.save(); APP.updateUI(); APP.closeSettings(); UTILS.toast('✅ Paramètres sauvegardés');
  },
  saveExercicePrefs: () => {
    document.querySelectorAll('[data-g]').forEach(i => {
      const g = i.getAttribute('data-g');
      const e = i.getAttribute('data-e');
      if(!STATE.exercicePrefs[g]) STATE.exercicePrefs[g] = {};
      STATE.exercicePrefs[g][e] = i.checked ? true : false;
    });
    UTILS.save(); UTILS.toast('✅ Exercices sauvegardés');
  },
  goPage: (name) => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page'+name).classList.add('active');
    document.getElementById('nav'+name).classList.add('active');
    if(name === 'Stats') UI.updateStats();
    if(name === 'Exercices') UI.renderExercices();
    if(name === 'Historique') UI.renderHistory();
  },
  generateProgram: async function(){
    const focus = GAME.getTodayFocus();
    if(!focus.groups.length){
      UTILS.toast('📆 Repos - Récupération active', false);
      STATE.todayQuests = [];
      STATE.questsDone = [];
      return;
    }

    const btn = document.getElementById('genBtn');
    btn.disabled = true;
    document.getElementById('loadingOverlay').classList.add('active');

    try {
      const lvl = UTILS.avgLevel();
      const exercises = GAME.getPool();
      const descriptions = {
        'pompes classiques': '3 séries à rythme normal',
        'pompes déclinées': '3 séries déclinées',
        'pompes diamant': '3 séries diamant',
        'pompes pike': '3 séries pike',
        'pompes explosives': '3 séries explosives',
        'dumbbell bench press': '3 séries avec haltères',
        'dumbbell floor press': '3 séries au sol',
        'tractions pronation': '3 séries pronation',
        'tractions supination': '3 séries supination',
        'tractions australiennes': '3 séries australiennes',
        'dead hang': '3 séries hang',
        'hanging knee raise': '3 séries genoux',
        'dumbbell rows': '3 séries rows',
        'single arm rows': '3 séries unilatérales',
        'squats classiques': '3 séries classiques',
        'squats sumo': '3 séries sumo',
        'squats jump': '3 séries explosives',
        'fentes avant': '3 séries fentes',
        'squats bulgares': '3 séries bulgares',
        'dumbbell squats': '3 séries avec haltères',
        'goblet squats': '3 séries goblet',
        'planche frontale': '3 séries, tenir le plus longtemps',
        'planche latérale': '3 séries par côté',
        'hollow body': '3 séries hollow',
        'leg raises': '3 séries jambes',
        'mountain climbers': '3 séries montagne',
        'dumbbell rotations': '3 séries rotations',
        'dumbbell chop': '3 séries chop'
      };

      STATE.todayQuests = exercises.map((ex, i) => ({
        name: ex.toUpperCase(),
        description: descriptions[ex] || '3 séries, maximal',
        xp: 100
      }));
      STATE.questsDone = new Array(exercises.length).fill(false);
      STATE.lastGenDate = UTILS.today();
      UTILS.save(); APP.updateUI(); UI.renderQuests(); UTILS.toast('⚡ Programme du jour généré!');
    } catch(e){
      UTILS.toast('❌ '+e.message, true);
    } finally {
      btn.disabled = false;
      document.getElementById('loadingOverlay').classList.remove('active');
    }
  },
  doneQuest: (i) => {
    if(STATE.questsDone[i]) return;
    const q = STATE.todayQuests[i];
    STATE.questsDone[i] = true;
    UTILS.addStatXP('force', Math.floor(q.xp*0.5));
    UTILS.addStatXP('perception', Math.floor(q.xp*0.3));
    UTILS.addStatXP('agility', Math.floor(q.xp*0.2));
    const td = UTILS.today();
    if(STATE.questsDone.every(c=>c) && STATE.lastStreakDate !== td){
      const ys = new Date(); ys.setDate(ys.getDate()-1);
      const ysStr = ys.toISOString().split('T')[0];
      if(!STATE.lastStreakDate || STATE.lastStreakDate === ysStr) STATE.streak++;
      else STATE.streak = 1;
      STATE.lastStreakDate = td;
    }
    STATE.activityLog.unshift({date:td,name:q.name,xp:q.xp});
    UTILS.save(); APP.updateUI(); UI.renderQuests(); UTILS.toast('✅ +'+q.xp);
  },
  updateUI: () => { UI.updateHeader(); UI.updateFocus(); UI.renderQuests(); },
  resetAll: () => { if(confirm('Réinitialiser?')){ localStorage.clear(); location.reload(); } },
  init: () => {
    UTILS.load();
    if(STATE.lastGenDate && STATE.lastGenDate !== UTILS.today()){ STATE.todayQuests = []; STATE.questsDone = []; }
    if(!STATE.cycleStartDate) STATE.cycleStartDate = UTILS.today();
    UTILS.save(); APP.updateUI();
  }
};

APP.init();
</script>
</body>
</html>
